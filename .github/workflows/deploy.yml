name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (selected or current ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ame180/ame-bot-telegram
          tags: |
            type=raw,value=latest,enable=${{ inputs.environment == 'prod' }}
            type=raw,value=dev,enable=${{ inputs.environment != 'prod' }}
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile-prod
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Compute and render compose file
        id: image-tag
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            TAG=latest
          else
            TAG=dev
          fi
          echo "Using tag: $TAG"
          sed "s#ghcr.io/ame180/ame-bot-telegram:latest#ghcr.io/ame180/ame-bot-telegram:$TAG#g" compose-prod.yml > compose.deploy.yml

      - name: Upload compose artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose-file
          path: compose.deploy.yml
          retention-days: 1

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Download compose artifact
        uses: actions/download-artifact@v4
        with:
          name: compose-file

      - name: Upload compose file via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "compose.deploy.yml"
          target: "${{ secrets.APP_PATH }}/"
          overwrite: true

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_PATH }}"
            mv -f compose.deploy.yml compose.yml
            docker compose pull
            docker compose up -d --force-recreate
